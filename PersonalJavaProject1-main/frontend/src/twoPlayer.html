<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Player Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>TWO PLAYER</h1>
      <p class="subtitle">Enter Player Names</p>
    </header>

	/*The button cannot be pressed until both names have been filled. (Could be optional)*/
    <main class="menu">
      <div class="name-field">
        <label for="playerX">Player X</label>
        <input type="text" id="playerX" placeholder="Player 1" maxlength="12">
      </div>

      <div class="name-field">
        <label for="playerO">Player O</label>
        <input type="text" id="playerO" placeholder="Player 2" maxlength="12">
      </div>

      <button id="startBtn" class="btn">Start Game</button>
    </main>

    <footer>
      <a href="index.html">Back</a>
    </footer>
  </div>

  <script src="twoPlayer.js"></script>
</body>
</html>
