<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container leaderboard-container">

    <header>
        <h1>LEADERBOARD</h1>
        <p class="subtitle">Top Ultimate Tic-Tac-Toe Players</p>
    </header>

    <main>

        <div class="leaderboard-tabs">
            <button class="tab-btn active" data-difficulty="hard">
                Hard
            </button>

            <button class="tab-btn" data-difficulty="impossible">
                Impossible
            </button>
        </div>

        <table class="leaderboard-table">

            <thead>

                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Wins</th>
                    <th>Tier</th>
                </tr>

            </thead>

            <tbody id="leaderboardBody">

                <tr class="gold-place">
                    <td>🥇</td>
                    <td>PixelMaster</td>
                    <td>5234</td>
                    <td>💎 Diamond</td>
                </tr>

                <tr class="silver-place">
                    <td>🥈</td>
                    <td>BoardWizard</td>
                    <td>4318</td>
                    <td>⭐ Platinum</td>
                </tr>

                <tr class="bronze-place">
                    <td>🥉</td>
                    <td>TicTacKing</td>
                    <td>2150</td>
                    <td>🥇 Gold</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>UltimateX</td>
                    <td>815</td>
                    <td>🥈 Silver</td>
                </tr>

                <tr>
                    <td>5</td>
                    <td>PlayerFive</td>
                    <td>72</td>
                    <td>🥉 Bronze</td>
                </tr>

            </tbody>

        </table>

    </main>

    <footer>
        <a href="index.html">Back</a>
    </footer>

</div>

<script src="../js/leaderboard.js"></script>

</body>
</html>
