<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MEGA TIC-TAC-TOE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 id="difficultyLabel"></h1>

    <div class="scoreboard" id="scoreboard">
      <div class="score-item">
        <span class="score-label" id = "scoreXLabel">Player X</span>
        <span class="score-value" id="scoreX">0</span>
        <span class="symbol-value" id="symbolX">X</span>

      </div>
      <div class="score-item">
        <span class="score-label" id="scoreOLabel">Player O</span>
        <span class="score-value" id="scoreO">0</span>
        <span class="symbol-value" id="symbolO">O</span>
      </div>
    </div>

    <div class="mega-board" id="megaBoard"></div>
    <p id="status"></p>
  </div>

  <div class="projector-overlay" id="projectorOverlay">
    <div class="projector-screen" id="projectorScreen">
      <h2 id="projectorMessage">Player X Wins!</h2>
      <div class="projector-scores">

        <div class="projector-score-item">
          <span id="projectorNameX">Player X</span>
          <span id="projectorScoreX">0</span>
        </div>

        <div class="projector-score-item">
          <span id="projectorNameO">Player O</span>
          <span id="projectorScoreO">0</span>
        </div>

      </div>
      <div class="projector-buttons">
        <button class="btn" id="restartBtn">Play Again</button>
        <a href="index.html" class="btn btn-secondary">Leave Game</a>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
